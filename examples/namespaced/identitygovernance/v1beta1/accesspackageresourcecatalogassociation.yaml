apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageResourceCatalogAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcecatalogassociation
  labels:
    testing.upbound.io/example-name: accesspackageresourcecatalogassociation
  name: accesspackageresourcecatalogassociation
  namespace: upbound-system
spec:
  forProvider:
    catalogIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcecatalogassociation
    resourceOriginIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcecatalogassociation
    resourceOriginSystem: AadGroup
---
apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageCatalog
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcecatalogassociation
  labels:
    testing.upbound.io/example-name: accesspackageresourcecatalogassociation
  name: accesspackageresourcecatalogassociation
  namespace: upbound-system
spec:
  forProvider:
    description: Example access package catalog
    displayName: example-catalog-association-catalog
---
apiVersion: groups.azuread.m.upbound.io/v1beta1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcecatalogassociation
  labels:
    testing.upbound.io/example-name: accesspackageresourcecatalogassociation
  name: accesspackageresourcecatalogassociation
  namespace: upbound-system
spec:
  forProvider:
    displayName: example-catalog-association-group
    securityEnabled: true
