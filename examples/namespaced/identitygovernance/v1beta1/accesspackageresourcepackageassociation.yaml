  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcepackageassociation
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-accesspackage-associations.sh
  labels:
    testing.upbound.io/example-name: accesspackageresourcepackageassociation
  name: accesspackageresourcepackageassociation
  namespace: upbound-system
spec:
  forProvider:
    description: Example access package catalog
    displayName: example-package-association-catalog
---
apiVersion: groups.azuread.m.upbound.io/v1beta1
kind: Group
