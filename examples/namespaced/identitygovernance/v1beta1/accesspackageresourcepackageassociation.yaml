apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageResourcePackageAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcepackageassociation
    upjet.upbound.io/manual-intervention: "Requires the EntitlementManagement.ReadWrite.All Graph application permission (or the Identity Governance Administrator role), which is not granted to the uptest identity"
  labels:
    testing.upbound.io/example-name: accesspackageresourcepackageassociation
  name: accesspackageresourcepackageassociation
  namespace: upbound-system
spec:
  forProvider:
    accessPackageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcepackageassociation
    catalogResourceAssociationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcepackageassociation
---
apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackage
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcepackageassociation
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-accesspackage-associations.sh
  labels:
    testing.upbound.io/example-name: accesspackageresourcepackageassociation
  name: accesspackageresourcepackageassociation
  namespace: upbound-system
spec:
  forProvider:
    catalogIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcepackageassociation
    description: Example access package
    displayName: example-package-association-package
---
apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageResourceCatalogAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageresourcepackageassociation
  labels:
    testing.upbound.io/example-name: accesspackageresourcepackageassociation
  name: accesspackageresourcepackageassociation
  namespace: upbound-system
spec:
  forProvider:
    catalogIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcepackageassociation
    resourceOriginIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageresourcepackageassociation
    resourceOriginSystem: AadGroup
---
apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageCatalog
