apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageCatalogRoleAssignment
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackagecatalogroleassignment
  labels:
    testing.upbound.io/example-name: accesspackagecatalogroleassignment
  name: accesspackagecatalogroleassignment
  namespace: upbound-system
spec:
  forProvider:
    catalogIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackagecatalogroleassignment
    principalObjectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackagecatalogroleassignment
    # Object ID of the built-in "Catalog owner" entitlement management role.
    # The azuread_access_package_catalog_role data source is not available as a
    # managed resource, so the role ID has to be supplied directly.
    roleId: ae79f266-94d4-4dab-b730-feca7e132178
---
apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
kind: AccessPackageCatalog
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackagecatalogroleassignment
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-accesspackage-associations.sh
  labels:
    testing.upbound.io/example-name: accesspackagecatalogroleassignment
  name: accesspackagecatalogroleassignment
  namespace: upbound-system
spec:
  forProvider:
    description: Example access package catalog
    displayName: example-role-assignment-catalog
---
apiVersion: groups.azuread.m.upbound.io/v1beta1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackagecatalogroleassignment
  labels:
    testing.upbound.io/example-name: accesspackagecatalogroleassignment
  name: accesspackagecatalogroleassignment
  namespace: upbound-system
spec:
  forProvider:
    displayName: example-catalog-owners
    securityEnabled: true
