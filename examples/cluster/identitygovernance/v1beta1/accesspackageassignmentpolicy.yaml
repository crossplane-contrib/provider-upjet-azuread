apiVersion: identitygovernance.azuread.upbound.io/v1beta1
kind: AccessPackageAssignmentPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageassignmentpolicy
    upjet.upbound.io/manual-intervention: "Requires the EntitlementManagement.ReadWrite.All Graph application permission (or the Identity Governance Administrator role), which is not granted to the uptest identity"
  labels:
    testing.upbound.io/example-name: accesspackageassignmentpolicy
  name: accesspackageassignmentpolicy
spec:
  forProvider:
    accessPackageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageassignmentpolicy
    approvalSettings:
      approvalRequired: true
      approvalStage:
      - approvalTimeoutInDays: 14
        primaryApprover:
        - objectIdSelector:
            matchLabels:
              testing.upbound.io/example-name: accesspackageassignmentpolicy-approvers
          subjectType: groupMembers
    assignmentReviewSettings:
      accessReviewTimeoutBehavior: keepAccess
      durationInDays: 3
      enabled: true
      reviewFrequency: weekly
      reviewType: Self
    description: My assignment policy
    displayName: assignment-policy
    durationInDays: 90
    question:
    - text:
        defaultText: hello, how are you?
    requestorSettings:
      requestor:
      - objectIdSelector:
          matchLabels:
            testing.upbound.io/example-name: accesspackageassignmentpolicy-requestors
        subjectType: groupMembers
      scopeType: SpecificDirectorySubjects
---
apiVersion: identitygovernance.azuread.upbound.io/v1beta1
kind: AccessPackage
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageassignmentpolicy
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-accesspackage-associations.sh
  labels:
    testing.upbound.io/example-name: accesspackageassignmentpolicy
  name: accesspackageassignmentpolicy
spec:
  forProvider:
    catalogIdSelector:
      matchLabels:
        testing.upbound.io/example-name: accesspackageassignmentpolicy
    description: Example access package
    displayName: example-policy-package
---
apiVersion: identitygovernance.azuread.upbound.io/v1beta1
kind: AccessPackageCatalog
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageassignmentpolicy
    uptest.upbound.io/pre-delete-hook: ../testhooks/delete-accesspackage-associations.sh
  labels:
    testing.upbound.io/example-name: accesspackageassignmentpolicy
  name: accesspackageassignmentpolicy
spec:
  forProvider:
    description: Example catalog
    displayName: example-policy-catalog
---
apiVersion: groups.azuread.upbound.io/v1beta2
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageassignmentpolicy
  labels:
    testing.upbound.io/example-name: accesspackageassignmentpolicy-approvers
  name: accesspackageassignmentpolicy-approvers
spec:
  forProvider:
    displayName: example-policy-approvers
    securityEnabled: true
---
apiVersion: groups.azuread.upbound.io/v1beta2
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: identitygovernance/v1beta1/accesspackageassignmentpolicy
  labels:
    testing.upbound.io/example-name: accesspackageassignmentpolicy-requestors
  name: accesspackageassignmentpolicy-requestors
spec:
  forProvider:
    displayName: example-policy-requestors
    securityEnabled: true
